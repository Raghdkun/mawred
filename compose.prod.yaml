# Production stack on a single VPS (ADR-0019). Images come from GHCR; secrets from .env.production.
# Full provisioning, backups and zero-downtime rollout scripts land in Phase 9 (deploy/).
name: mawred

x-app: &app
  image: ghcr.io/raghdkun/mawred-app:${MAWRED_TAG:-latest}
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - storage:/app/storage/app
  depends_on:
    pgsql: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_HOST: ${APP_HOST}
      CAREERS_HOST: ${CAREERS_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging

  app:
    <<: *app
    mem_limit: 1536m

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck: { test: ["CMD", "php", "artisan", "horizon:status"], interval: 30s, retries: 3 }
    mem_limit: 1024m

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck: { disable: true }
    mem_limit: 256m

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck: { disable: true }
    mem_limit: 256m

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgsql:/var/lib/postgresql]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"], interval: 5s, retries: 10 }
    mem_limit: 2048m
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    mem_limit: 512m
    logging: *logging

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-max-concurrency=2", "--api-timeout=60s"]
    mem_limit: 1024m
    logging: *logging

  waha:
    image: devlikeapro/waha:latest # pin a tested tag before go-live (D8)
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY}
    volumes: [waha:/app/.sessions]
    mem_limit: 512m
    logging: *logging

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav:/var/lib/clamav]
    mem_limit: 1536m
    logging: *logging

volumes:
  storage:
  pgsql:
  redis:
  caddy_data:
  caddy_config:
  waha:
  clamav:
