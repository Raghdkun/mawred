# Production stack on a single VPS (ADR-0019). Images come from GHCR; secrets from .env.production.
# Always run through deploy/ (deploy.sh, backup.sh…): they pin MAWRED_TAG to the deployed image.
# The host's nginx (deploy/nginx/) terminates TLS and proxies to the ports published on 127.0.0.1;
# nothing here listens publicly. See deploy/README.md for the server layout, timers and runbooks.
name: mawred

x-app: &app
  image: ghcr.io/raghdkun/mawred-app:${MAWRED_TAG:-latest}
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - storage:/app/storage/app
    - backups:/app/storage/backups
  depends_on:
    pgsql: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # Two slots for zero-downtime deploys (D134): deploy.sh starts the idle one with the new image,
  # points nginx at its port, then stops the other. Only one runs between deploys; the profile
  # keeps a plain `docker compose up` from starting both.
  app-blue:
    <<: *app
    profiles: [app]
    ports: ["127.0.0.1:${MAWRED_BLUE_PORT:-8081}:8080"]
    mem_limit: 1536m

  app-green:
    <<: *app
    profiles: [app]
    ports: ["127.0.0.1:${MAWRED_GREEN_PORT:-8082}:8080"]
    mem_limit: 1536m

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck: { test: ["CMD", "php", "artisan", "horizon:status"], interval: 30s, retries: 3 }
    # Lets running jobs finish when a deploy replaces it (Horizon stops gracefully on SIGTERM).
    stop_grace_period: 90s
    mem_limit: 1024m

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck: { disable: true }
    mem_limit: 256m

  # Server-side rendering for the careers site (D87); the app falls back to client rendering if
  # it is down. The app reaches it through INERTIA_SSR_URL=http://ssr:13714 in .env.production.
  ssr:
    <<: *app
    command: ["php", "artisan", "inertia:start-ssr"]
    healthcheck: { test: ["CMD", "php", "artisan", "inertia:check-ssr"], interval: 30s, retries: 3 }
    mem_limit: 384m

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports: ["127.0.0.1:${MAWRED_REVERB_PORT:-8090}:8080"]
    healthcheck: { disable: true }
    mem_limit: 256m

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgsql:/var/lib/postgresql]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"], interval: 5s, retries: 10 }
    mem_limit: 2048m
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    mem_limit: 512m
    logging: *logging

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-max-concurrency=2", "--api-timeout=60s"]
    mem_limit: 1024m
    logging: *logging

  waha:
    image: devlikeapro/waha:latest # pin a tested tag before go-live (D8)
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY}
    volumes: [waha:/app/.sessions]
    mem_limit: 512m
    logging: *logging

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav:/var/lib/clamav]
    mem_limit: 1536m
    logging: *logging

  # Error and performance tracking (D21): GlitchTip speaks the Sentry protocol. One container runs
  # the web app and its worker, and migrates its own database on start. It shares Postgres (its
  # own `glitchtip` database, created by `deploy.sh init`) and Redis (database 3).
  glitchtip:
    image: glitchtip/glitchtip:${GLITCHTIP_TAG:-6.2.6}
    restart: unless-stopped
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@pgsql:5432/glitchtip
      VALKEY_URL: redis://redis:6379/3
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://${GLITCHTIP_HOST:-localhost}
      DEFAULT_FROM_EMAIL: ${MAIL_FROM_ADDRESS}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "30"
      GRANIAN_WORKERS_MAX_RSS: "640"
    ports: ["127.0.0.1:${MAWRED_GLITCHTIP_PORT:-8070}:8000"]
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1024m
    logging: *logging

  # Copies backup archives offsite (D15) with a write-only key; only `deploy/backup.sh` runs it.
  offsite:
    image: rclone/rclone:1.71
    profiles: [ops]
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: Other
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-us-east-1}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes: [backups:/backups:ro]
    mem_limit: 256m
    logging: *logging

volumes:
  storage:
  backups:
  pgsql:
  redis:
  waha:
  clamav:
