# WebSockets to Reverb (ADR-0019, D134). Installed into /etc/nginx/snippets/ by deploy/nginx-site.sh.
# Clients ping well inside the read timeout, so idle connections stay open.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $mawred_connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
