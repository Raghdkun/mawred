# Shared by every Mawred server block (ADR-0019, D134). Installed into /etc/nginx/snippets/ by
# deploy/nginx-site.sh; edit it in the repository, not on the server.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:mawred_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

# The app sends its own Content-Security-Policy (frame-ancestors 'self': CV previews frame same-origin).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
