# Proxy settings for the Mawred upstreams (ADR-0019, D134). Installed into /etc/nginx/snippets/ by
# deploy/nginx-site.sh. nginx is the edge, so it replaces any forwarding headers the client sent;
# the app trusts them only from loopback and the Docker bridge (bootstrap/app.php).

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# The app's response headers (CSP with a nonce, preload Link headers, cookies) outgrow nginx's
# default 4–8 KB header buffer, which turns pages into 502s.
proxy_buffer_size 32k;
proxy_buffers 16 32k;
proxy_busy_buffers_size 64k;

# nginx adds these for every response (mawred-site.conf); don't send them twice.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Powered-By;
